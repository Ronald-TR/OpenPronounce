name: Deploy web to GitHub Pages

# Builds the client-side app (web/) and publishes it to GitHub Pages.
#
# Notes:
# - The site is served from /<repo>/, so VITE_BASE is set accordingly.
# - GitHub Pages cannot set COOP/COEP headers; coi-serviceworker (bundled in
#   web/public/) enables cross-origin isolation by adding them client-side.
# - The acoustic encoder is NOT self-hosted in this test deploy: the site
#   scores with phones + words (the app degrades gracefully). Serve
#   web/public/models from a CDN to enable the acoustic term.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: web
        run: npx vitest run

      - name: Build
        working-directory: web
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
